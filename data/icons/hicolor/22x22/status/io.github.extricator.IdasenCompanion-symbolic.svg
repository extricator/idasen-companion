<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 22 22">
  <defs>
    <style type="text/css" id="current-color-scheme">
      .ColorScheme-Text { color: #232629; }
    </style>
  </defs>
  <!-- Native 22px grid: longer legs, with the complete silhouette centered vertically (4px margins). -->
  <g class="ColorScheme-Text" fill="currentColor" shape-rendering="crispEdges">
    <rect x="2" y="4" width="18" height="3"/>
    <rect x="5" y="7" width="2" height="9"/>
    <rect x="15" y="7" width="2" height="9"/>
    <rect x="3" y="16" width="6" height="2"/>
    <rect x="13" y="16" width="6" height="2"/>
  </g>
</svg>
