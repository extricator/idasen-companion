<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 16 16">
  <defs>
    <style type="text/css" id="current-color-scheme">
      .ColorScheme-Text { color: #232629; }
    </style>
  </defs>
  <!-- Preferred centered 16px reference; only vertical legs lengthened and feet lowered. -->
  <g class="ColorScheme-Text" fill="currentColor" shape-rendering="crispEdges">
    <rect x="1" y="3" width="14" height="2"/>
    <rect x="3" y="5" width="1" height="7"/>
    <rect x="12" y="5" width="1" height="7"/>
    <rect x="2" y="12" width="3" height="2"/>
    <rect x="11" y="12" width="3" height="2"/>
  </g>
</svg>
