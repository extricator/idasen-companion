name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, no leading v (e.g. 1.1.0). Must already match __version__ on the default branch.'
        required: true
        type: string
      dry_run:
        description: 'Build and checksum only — create no tag and no release'
        required: false
        default: false
        type: boolean
      promotion_run_id:
        description: 'Successful main-branch dry-run ID to promote (real dispatch only)'
        required: false
        type: string
      full_rebuild:
        description: 'Explicitly rebuild and verify all assets for a real release'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  # Resolve the version and one explicit route before any expensive work.
  gate:
    name: The requested version agrees with __version__
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      release: ${{ steps.resolve.outputs.release }}
      mode: ${{ steps.resolve.outputs.mode }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Resolve the version and refuse one that disagrees with the source
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          PROMOTION_RUN_ID: ${{ inputs.promotion_run_id }}
          FULL_REBUILD: ${{ inputs.full_rebuild }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          SOURCE=$(python3 -c "import sys; sys.path.insert(0, 'src'); import idasen_companion; print(idasen_companion.__version__)")

          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            REQUESTED="${GITHUB_REF_NAME#v}"
            ORIGIN="tag $GITHUB_REF_NAME"
            RELEASE=true
            MODE=rebuild
          else
            REQUESTED="${INPUT_VERSION#v}"
            ORIGIN="the version entered on the Actions form"
            if [ "$INPUT_DRY_RUN" = "true" ]; then RELEASE=false; else RELEASE=true; fi
            if [ "$RELEASE" = "false" ]; then
              [ -z "$PROMOTION_RUN_ID" ] && [ "$FULL_REBUILD" != true ] || exit 1
              MODE=dry-run
            elif [ -n "$PROMOTION_RUN_ID" ] && [ "$FULL_REBUILD" != true ]; then
              [[ "$PROMOTION_RUN_ID" =~ ^[1-9][0-9]*$ ]] || exit 1
              MODE=promote
            elif [ -z "$PROMOTION_RUN_ID" ] && [ "$FULL_REBUILD" = true ]; then
              MODE=rebuild
            else
              echo 'Select exactly one real-release mode: promotion run ID or full rebuild.' >&2
              exit 1
            fi

            # A release cut from a side branch would carry that branch's code
            # under a version number the default branch also claims. A dry run
            # is exactly how you test a branch, so it stays allowed.
            if [ "$RELEASE" = "true" ] && [ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]; then
              echo "Refusing to release from $GITHUB_REF_NAME; releases are cut from $DEFAULT_BRANCH." >&2
              echo "Re-run with the dry-run box ticked to exercise the path from this branch." >&2
              exit 1
            fi
          fi

          if [ "$REQUESTED" != "$SOURCE" ]; then
            echo "$ORIGIN names version $REQUESTED, but the source says $SOURCE." >&2
            echo "Nothing is built or published until the two agree. Land the" >&2
            echo "version bump on $DEFAULT_BRANCH first." >&2
            exit 1
          fi

          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$RELEASE" = true ]; then
            current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$DEFAULT_BRANCH" --jq '.object.sha')
            [ "$current" = "$GITHUB_SHA" ] || {
              echo "The default branch moved; start a new dry run on its current commit." >&2
              exit 1
            }
          fi

          echo "$ORIGIN agrees with the source version $SOURCE"
          {
            echo "version=$SOURCE"
            echo "tag=v$SOURCE"
            echo "release=$RELEASE"
            echo "mode=$MODE"
          } >> "$GITHUB_OUTPUT"

      # Only meaningful for a dispatch, where the tag does not exist yet. On a
      # tag push the ref is already there by definition, so this is skipped
      # rather than made to pass trivially.
      - name: Refuse a version that has already been released
        if: github.event_name == 'workflow_dispatch' && steps.resolve.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists. A released version is spent: pick the next one." >&2
            exit 1
          fi
          echo "$TAG is free"

  verify:
    if: needs.gate.outputs.mode != 'promote'
    needs: gate
    uses: ./.github/workflows/verify.yml
    permissions:
      contents: read

  packages:
    if: needs.gate.outputs.mode != 'promote'
    needs: gate
    uses: ./.github/workflows/packages.yml
    permissions:
      contents: read
    with:
      rpm: true
      deb: true
      flatpak: true
      rpm_portability: true

  # Both dry runs and full rebuilds assemble and verify before publication.
  package:
    name: Assemble and checksum the release assets
    needs: [gate, verify, packages]
    if: needs.gate.outputs.mode != 'promote'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Unshallow, for the tag list. The release body below links a
          # comparison against the previous release, and the default checkout
          # brings down neither the tags nor the history to place them
          # against. The repository is small enough that the full fetch costs
          # nothing worth measuring.
          fetch-depth: 0

      # The download and upload actions version independently. A pair matched
      # for tidiness has already failed to resolve in this repository, so pin
      # each against its own releases.
      - name: Download the built RPM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: idasen-companion-rpm
          path: artifacts

      - name: Download the built .deb
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: idasen-companion-deb
          path: artifacts

      - name: Download the built Flatpak bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: idasen-companion-flatpak
          path: artifacts

      - name: Install the five-artifact verifier's host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y podman flatpak

      - name: Verify and assemble the release assets
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: python3 scripts/release-assets.py assemble . "$VERSION" "$GITHUB_SHA" "$GITHUB_RUN_ID"

      - name: Hand the assembled assets to the publish job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-assets
          path: |
            artifacts/
            release-notes.md
            provenance.json
          if-no-files-found: error
          retention-days: 1

  promote:
    name: Validate a selected dry run
    needs: gate
    if: needs.gate.outputs.mode == 'promote'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out the exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Verify source run and required proof jobs
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.promotion_run_id }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: python3 scripts/release-assets.py provenance "$RUN_ID" "$GITHUB_SHA" "$VERSION"
      - name: Download the selected assembled set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-assets
          run-id: ${{ inputs.promotion_run_id }}
          github-token: ${{ github.token }}
      - name: Revalidate names, version, provenance, and every checksum
        env:
          RUN_ID: ${{ inputs.promotion_run_id }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: python3 scripts/release-assets.py assets . "$VERSION" "$GITHUB_SHA" "$RUN_ID"
      - name: Hand the validated set to the publish job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-assets
          path: |
            artifacts/
            release-notes.md
            provenance.json
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish the release
    needs: [gate, verify, packages, package, promote]
    # Only the final publisher has contents:write. A dry run cannot reach it.
    if: ${{ always() && needs.gate.result == 'success' && needs.gate.outputs.release == 'true' && ((needs.gate.outputs.mode == 'promote' && needs.promote.result == 'success') || (needs.gate.outputs.mode == 'rebuild' && needs.verify.result == 'success' && needs.packages.result == 'success' && needs.package.result == 'success')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Download the assembled assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-assets

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.gate.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          RPM=(artifacts/idasen-companion-[0-9]*.rpm)
          RPM_HEADLESS=(artifacts/idasen-companion-headless-*.rpm)
          DEB=(artifacts/idasen-companion_[0-9]*.deb)
          DEB_HEADLESS=(artifacts/idasen-companion-headless_*.deb)
          FLATPAK=(artifacts/idasen-companion-[0-9]*.flatpak)
          for count in "${#RPM[@]}" "${#RPM_HEADLESS[@]}" "${#DEB[@]}" "${#DEB_HEADLESS[@]}" "${#FLATPAK[@]}"; do
            [ "$count" -eq 1 ] || exit 1
          done
          (cd artifacts && sha256sum --check SHA256SUMS)
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
            [ "$current" = "$GITHUB_SHA" ] || {
              echo 'main moved after release preparation; refusing publication.' >&2
              exit 1
            }
          fi
          # Published outright rather than as a draft. The draft existed so the
          # one-time 1.0 verification gate could check the real bytes before
          # anyone saw them; that gate retired with 1.0, leaving a manual step
          # guarding nothing.
          #
          # On a dispatch the tag does not exist yet, so it is created here
          # pointing at the exact commit these artifacts were built from --
          # naming the target rather than letting it default keeps the tag and
          # the binaries from ever describing different trees. On a tag push
          # the ref is already there and no target is passed.
          #
          # The target repository is named explicitly. This job holds only the
          # downloaded assets and no working tree, and gh otherwise shells out
          # to git to infer the repository -- which fails outright rather than
          # falling back to the environment it is already running in.
          TARGET=()
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TARGET=(--target "$GITHUB_SHA")
          fi

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            "${TARGET[@]}" \
            --title "$TAG" \
            --notes-file release-notes.md \
            "${RPM[0]}" \
            "${RPM_HEADLESS[0]}" \
            "${DEB[0]}" \
            "${DEB_HEADLESS[0]}" \
            "${FLATPAK[0]}" \
            artifacts/SHA256SUMS

      - name: Verify published bytes and tag target
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.gate.outputs.tag }}
        run: |
          set -euo pipefail
          object=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG")
          type=$(jq -r '.object.type' <<< "$object")
          target=$(jq -r '.object.sha' <<< "$object")
          for _ in 1 2 3; do
            [ "$type" = tag ] || break
            object=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$target")
            type=$(jq -r '.object.type' <<< "$object")
            target=$(jq -r '.object.sha' <<< "$object")
          done
          [ "$type" = commit ] || { echo 'Published tag does not resolve to a commit.' >&2; exit 1; }
          [ "$target" = "$GITHUB_SHA" ] || { echo 'Published tag points at another commit.' >&2; exit 1; }
          mkdir published
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir published
          (cd published && sha256sum --check ../artifacts/SHA256SUMS)
          [ "$(find published -maxdepth 1 -type f | wc -l)" -eq 6 ]
          body=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
          [ "$body" = "$(cat release-notes.md)" ] || { echo 'Published release notes differ.' >&2; exit 1; }
          title=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json name --jq .name)
          [ "$title" = "$TAG" ] || { echo 'Published release title differs.' >&2; exit 1; }

  cleanup:
    name: Retire consumed release artifacts
    needs: [gate, package, promote, publish]
    if: ${{ always() && (needs.gate.outputs.mode == 'dry-run' && needs.package.result == 'success' || needs.gate.outputs.release == 'true' && needs.publish.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - name: Check out cleanup script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Delete intermediate artifacts by verified run and ID
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ needs.gate.outputs.mode }}
          SOURCE_RUN_ID: ${{ inputs.promotion_run_id }}
        run: |
          python3 scripts/release-assets.py cleanup "$GITHUB_RUN_ID" \
            idasen-companion-rpm idasen-companion-deb idasen-companion-flatpak
          if [ "$MODE" != dry-run ]; then
            python3 scripts/release-assets.py cleanup "$GITHUB_RUN_ID" release-assets
          fi
          if [ "$MODE" = promote ]; then
            python3 scripts/release-assets.py cleanup "$SOURCE_RUN_ID" release-assets
          fi
