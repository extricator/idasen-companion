name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, no leading v (e.g. 1.1.0). Must already match __version__ on the default branch.'
        required: true
        type: string
      dry_run:
        description: 'Build and checksum only — create no tag and no release'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  # Both triggers converge here, on one resolved version, so everything
  # downstream is a single path. Two triggers with two code paths would leave
  # the rarely-used one to rot unnoticed.
  gate:
    name: The requested version agrees with __version__
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      release: ${{ steps.resolve.outputs.release }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Resolve the version and refuse one that disagrees with the source
        id: resolve
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          SOURCE=$(python3 -c "import sys; sys.path.insert(0, 'src'); import idasen_companion; print(idasen_companion.__version__)")

          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            REQUESTED="${GITHUB_REF_NAME#v}"
            ORIGIN="tag $GITHUB_REF_NAME"
            RELEASE=true
          else
            REQUESTED="${INPUT_VERSION#v}"
            ORIGIN="the version entered on the Actions form"
            if [ "$INPUT_DRY_RUN" = "true" ]; then RELEASE=false; else RELEASE=true; fi

            # A release cut from a side branch would carry that branch's code
            # under a version number the default branch also claims. A dry run
            # is exactly how you test a branch, so it stays allowed.
            if [ "$RELEASE" = "true" ] && [ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]; then
              echo "Refusing to release from $GITHUB_REF_NAME; releases are cut from $DEFAULT_BRANCH." >&2
              echo "Re-run with the dry-run box ticked to exercise the path from this branch." >&2
              exit 1
            fi
          fi

          if [ "$REQUESTED" != "$SOURCE" ]; then
            echo "$ORIGIN names version $REQUESTED, but the source says $SOURCE." >&2
            echo "Nothing is built or published until the two agree. Land the" >&2
            echo "version bump on $DEFAULT_BRANCH first." >&2
            exit 1
          fi

          echo "$ORIGIN agrees with the source version $SOURCE"
          {
            echo "version=$SOURCE"
            echo "tag=v$SOURCE"
            echo "release=$RELEASE"
          } >> "$GITHUB_OUTPUT"

      # Only meaningful for a dispatch, where the tag does not exist yet. On a
      # tag push the ref is already there by definition, so this is skipped
      # rather than made to pass trivially.
      - name: Refuse a version that has already been released
        if: github.event_name == 'workflow_dispatch' && steps.resolve.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists. A released version is spent: pick the next one." >&2
            exit 1
          fi
          echo "$TAG is free"

  # Rebuilding at the tag, rather than reusing whatever the tagged commit's CI
  # run happened to produce, keeps one source of truth per format: a docs-only
  # tagged commit legitimately skips those builds in CI, leaving nothing to
  # attach.
  rpm:
    needs: gate
    uses: ./.github/workflows/rpm.yml
    with:
      force: true

  deb:
    needs: gate
    uses: ./.github/workflows/deb.yml
    with:
      force: true

  flatpak:
    needs: gate
    uses: ./.github/workflows/flatpak.yml
    with:
      force: true

  # Assembling is deliberately a separate job from publishing, and runs on every
  # trigger. A manual run is meant to exercise the whole path before the tag is
  # spent, and the parts most worth exercising are here: resolving each built
  # filename, refusing an ambiguous match, renaming the bundle and checksumming
  # the set. Folding these into the publish job would have left a manual run
  # doing nothing the ordinary CI build does not already do.
  package:
    name: Assemble and checksum the release assets
    needs: [gate, rpm, deb, flatpak]
    runs-on: ubuntu-24.04
    outputs:
      rpm: ${{ steps.assets.outputs.rpm }}
      deb: ${{ steps.assets.outputs.deb }}
      flatpak: ${{ steps.assets.outputs.flatpak }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # The download and upload actions version independently. A pair matched
      # for tidiness has already failed to resolve in this repository, so pin
      # each against its own releases.
      - name: Download the built RPM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: idasen-companion-rpm
          path: artifacts

      - name: Download the built .deb
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: idasen-companion-deb
          path: artifacts

      - name: Download the built Flatpak bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: idasen-companion-flatpak
          path: artifacts

      - name: Resolve each asset's filename and checksum the three
        id: assets
        run: |
          VERSION=$(python3 -c "import sys; sys.path.insert(0, 'src'); import idasen_companion; print(idasen_companion.__version__)")
          cd artifacts
          shopt -s nullglob

          # rpmbuild and dpkg-buildpackage choose their own release suffixes,
          # so neither name can be written out ahead of time. Resolve each and
          # refuse to continue unless the match is unique: the unshipped split
          # spec builds a package of a very similar name, which must never
          # reach a release by accident.
          rpm_matches=(idasen-companion-*.rpm)
          if [ "${#rpm_matches[@]}" -ne 1 ]; then
            echo "Expected exactly one RPM, found ${#rpm_matches[@]}: ${rpm_matches[*]}" >&2
            exit 1
          fi
          deb_matches=(idasen-companion_*.deb)
          if [ "${#deb_matches[@]}" -ne 1 ]; then
            echo "Expected exactly one .deb, found ${#deb_matches[@]}: ${deb_matches[*]}" >&2
            exit 1
          fi
          RPM="${rpm_matches[0]}"
          DEB="${deb_matches[0]}"

          # The bundle is built under a fixed name because CI rebuilds it on
          # every push, where a version in the filename buys nothing. A file
          # downloaded to sit beside two versioned siblings wants one, so it
          # gains it here rather than in the builder.
          FLATPAK="idasen-companion-${VERSION}.flatpak"
          mv idasen-companion.flatpak "$FLATPAK"

          # One checksum file for all three, written beside them, so
          # `sha256sum -c` works wherever the four are downloaded together.
          sha256sum "$RPM" "$DEB" "$FLATPAK" > SHA256SUMS
          cat SHA256SUMS

          {
            echo "VERSION=$VERSION"
            echo "RPM=$RPM"
            echo "DEB=$DEB"
            echo "FLATPAK=$FLATPAK"
          } >> "$GITHUB_ENV"

          # The publish job is a separate job, so the environment above does not
          # reach it. Hand the resolved names over as job outputs instead, and
          # let it name each asset explicitly rather than re-globbing them.
          {
            echo "rpm=$RPM"
            echo "deb=$DEB"
            echo "flatpak=$FLATPAK"
          } >> "$GITHUB_OUTPUT"

      - name: Write the release body from the changelog
        env:
          TAG: ${{ needs.gate.outputs.tag }}
        run: |
          # Notes only. Installing and verifying are documented once, in the
          # README, and linked at this tag rather than restated here.
          #
          # Linked at the tag, not at the ref the run started from: a dispatch
          # runs on the default branch, so using that would point every release
          # body at a moving target instead of the tree it describes.
          scripts/extract-changelog.sh "$VERSION" > release-notes.md
          {
            echo
            echo "Installation and checksum verification: see the [README](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/README.md#install)."
          } >> release-notes.md
          cat release-notes.md

      - name: Hand the assembled assets to the publish job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-assets
          path: |
            artifacts/
            release-notes.md
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [gate, package]
    # A dry run stops here, and only here. Everything above it has already run,
    # so a dry run still proves the builds and the assembly; what it does not do
    # is create a tag or a release. This is also the only job allowed to write
    # to the repository, and leaving it unreachable from a dry run keeps that
    # reach off every run that is only rehearsing.
    #
    # The cost of that gate, stated plainly because it bit once: no dry run can
    # exercise this job, so anything below is first proved by a real release.
    # Keep it to as few moving parts as possible for that reason.
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download the assembled assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-assets

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          RPM: ${{ needs.package.outputs.rpm }}
          DEB: ${{ needs.package.outputs.deb }}
          FLATPAK: ${{ needs.package.outputs.flatpak }}
          TAG: ${{ needs.gate.outputs.tag }}
        run: |
          # Published outright rather than as a draft. The draft existed so the
          # one-time 1.0 verification gate could check the real bytes before
          # anyone saw them; that gate retired with 1.0, leaving a manual step
          # guarding nothing.
          #
          # On a dispatch the tag does not exist yet, so it is created here
          # pointing at the exact commit these artifacts were built from --
          # naming the target rather than letting it default keeps the tag and
          # the binaries from ever describing different trees. On a tag push
          # the ref is already there and no target is passed.
          #
          # The target repository is named explicitly. This job holds only the
          # downloaded assets and no working tree, and gh otherwise shells out
          # to git to infer the repository -- which fails outright rather than
          # falling back to the environment it is already running in.
          TARGET=()
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TARGET=(--target "$GITHUB_SHA")
          fi

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            "${TARGET[@]}" \
            --notes-file release-notes.md \
            "artifacts/$RPM" \
            "artifacts/$DEB" \
            "artifacts/$FLATPAK" \
            artifacts/SHA256SUMS
