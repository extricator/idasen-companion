name: RPM

on:
  workflow_call:
    inputs:
      force:
        description: Build regardless of which paths the change touches
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rpm:
    name: Build the self-contained RPM
    runs-on: ubuntu-24.04
    # The image below is the machine that builds the package, and says nothing
    # about where the package runs: the artifact carries its own Python
    # runtime, Qt included, and declares nothing but sonames plus an
    # interpreter floor. Building it a second time somewhere else would produce
    # the same bytes and, worse, read as a list of supported distributions —
    # which is the claim this package exists to stop making.
    container: fedora:43
    outputs:
      # The proof below has nothing to prove when no package was built, and
      # the step that decides that is invisible outside this job otherwise.
      relevant: ${{ steps.changed.outputs.relevant }}
    steps:
      - name: Install git
        run: dnf install -y git

      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Trust the checkout directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Determine whether this change touches packaging-relevant paths
        id: changed
        run: |
          # A caller that asks for a build has already decided it must happen:
          # a release rebuilds at its own tag, where a diff of touched paths
          # says nothing about whether the artifact is wanted.
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
            # First push of a new branch (or a workflow_dispatch run, which has
            # neither event field): diff against the empty tree so everything
            # counts as changed rather than erroring.
            case "$BASE" in
              0000000000000000000000000000000000000000|"") BASE=$(git hash-object -t tree /dev/null) ;;
            esac
          fi
          CHANGED=$(git diff --name-only "$BASE" "${{ github.sha }}")
          echo "Changed files:"
          echo "$CHANGED"
          if echo "$CHANGED" | grep -qE '^(packaging/|data/|pyproject\.toml|MANIFEST\.in|src/|tests/|scripts/|\.github/workflows/rpm\.yml)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install build dependencies
        if: steps.changed.outputs.relevant == 'true'
        run: |
          # Every build requirement the spec declares, plus the tools that run
          # before rpmbuild does — python3-build, and the pip and setuptools
          # its isolated environment is assembled with, all three for the sdist
          # step below. The package's own installs are run by the interpreter
          # it carries, which brings its own of both.
          #
          # The last nine are asked for the way the spec asks for them, as
          # capabilities rather than as package names, so that neither file
          # names a distribution's package: three program paths, two for the
          # trimmers to shell out to and one the session bus the build starts
          # the daemon on, then six sonames. The sonames are quoted because
          # the shell would otherwise read the parentheses as its own syntax.
          dnf install -y \
            rpm-build rpmdevtools python3-devel python3-pip python3-build \
            python3-setuptools systemd-rpm-macros desktop-file-utils \
            python3-pytest python3-pytest-asyncio \
            /usr/bin/strip /usr/bin/objdump /usr/bin/dbus-run-session \
            'libGL.so.1()(64bit)' 'libEGL.so.1()(64bit)' \
            'libxkbcommon.so.0()(64bit)' 'libfontconfig.so.1()(64bit)' \
            'libfreetype.so.6()(64bit)' 'libdbus-1.so.3()(64bit)'

      - name: Build both RPM release variants
        if: steps.changed.outputs.relevant == 'true'
        run: bash scripts/build-release-variants.sh --rpm --output dist-rpm

      - name: Ask the built package what it requires, offers and is written as
        if: steps.changed.outputs.relevant == 'true'
        # Between building and uploading on purpose. All three questions are
        # about metadata rpmbuild generates rather than about anything written
        # in the spec, so nothing before this point can answer them — and a
        # gate that runs after the artifact is published is not a gate.
        run: |
          scripts/verify-rpm-metadata.sh dist-rpm/idasen-companion-[0-9]*.rpm
          scripts/verify-rpm-metadata.sh dist-rpm/idasen-companion-headless-*.rpm

      - name: Upload the built RPM
        if: steps.changed.outputs.relevant == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: idasen-companion-rpm
          path: dist-rpm/*.rpm
          if-no-files-found: error
          retention-days: 1

  # Deliberately a job on the runner rather than a step in the one above: the
  # build runs inside a container already, and starting containers from in
  # there needs a privilege this runner does not hand out. Coming back through
  # the uploaded artifact costs one download and proves something the nested
  # form could not -- that what a release publishes is what was installed and
  # started, not a file that only ever existed in a build directory.
  #
  # One job for the two standalone flavors. Which environments they are
  # carried into is a decision the script owns; splitting those environments
  # across jobs here would turn evidence into a support-matrix claim.
  portability:
    name: Install and start the package away from where it was built
    needs: [rpm]
    if: needs.rpm.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Download the built RPM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: idasen-companion-rpm
          path: package

      - name: Install each flavor and start its daemon in containers
        run: |
          for artifact in package/*.rpm; do
            scripts/verify-rpm-portability.sh "$artifact"
          done
