name: Verify

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  tests:
    name: Tests / Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libglib2.0-0 libdbus-1-3 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1

      - name: Install the package with its gui and test extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[gui,test]'

      - name: Fail if the GUI extra did not install
        run: python -c "import PySide6.QtWidgets"

      - name: Run the test suite with the coverage gate
        run: python -m pytest -q --cov=idasen_companion --cov-fail-under=77 --cov-report=term-missing
  code:
    name: Quality / Code
    runs-on: ubuntu-24.04
    steps:
      # Every third-party action reference below names a commit rather than a
      # release: a release tag can be moved by whoever owns it after the fact,
      # while the commit it named at review time cannot change under us.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      # mypy is deliberately not a project dependency (see [tool.mypy] in
      # pyproject.toml) and is pinned separately from the code it checks.
      # It needs to resolve third-party types from an environment carrying
      # both the gui and test extras -- missing either produces false errors
      # that have nothing to do with the code under check. No flag here
      # overrides [tool.mypy]; that config is the single source of truth.
      - name: Install the package with its gui and test extras into a throwaway venv
        run: |
          python -m venv .mypy-target
          .mypy-target/bin/pip install --upgrade pip
          .mypy-target/bin/pip install -e '.[gui,test]'

      - name: Install mypy at its pinned version
        run: python -m pip install --upgrade pip mypy==2.3.0

      - name: Run mypy against the throwaway venv's interpreter
        run: python -m mypy --python-executable .mypy-target/bin/python src/

      - name: Install pylint at its pinned version
        run: python -m pip install --upgrade pip pylint==4.0.6

      # Config comes from [tool.pylint.main]/[tool.pylint.basic] in
      # pyproject.toml, auto-discovered from the repository root -- the same
      # thing a developer gets running the identical command locally.
      - name: Run pylint over src/idasen_companion
        run: pylint src/idasen_companion

      - name: Run the naming scope-span check
        run: python scripts/check_naming_span.py src

  distribution:
    name: Quality / Distribution and supply chain
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Fetch the refs a checkout leaves behind
        run: git fetch origin '+refs/pull/*/head:refs/remotes/origin/pr/*'

      - name: Scan the full commit history
        run: bash scripts/scan-secrets.sh history

      # History and working-tree scans answer different questions. Only the
      # working-tree scan sees a file present in the checkout but in no
      # commit -- the class of finding that sat in an untracked, gitignored
      # file in this repository on 2026-08-10.
      - name: Scan the working tree
        run: bash scripts/scan-secrets.sh worktree

      # No separate assertion on either step's output is needed or wanted: a
      # green step already means its canary fired, because the shared script
      # refuses to reach its real scan otherwise. That is the strongest
      # available proof, and this project gates on exit codes alone.

      - name: Install build
        run: python -m pip install --upgrade pip build

      # The build script carries all four artifact checks and its own
      # failure messages; running it here rather than duplicating the checks
      # in YAML keeps the gate in one place, the same command a developer
      # runs locally.
      - name: Run the artifact content audit
        run: bash scripts/build-dist.sh

      - name: Install gettext
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gettext

      # When this gate goes red on a future pull request, the first question
      # is whether the toolchain moved -- the answer belongs in this log.
      - name: Log the catalog toolchain versions
        run: |
          xgettext --version
          msgmerge --version

      - name: Regenerate the app catalog
        run: bash scripts/build-translations.sh

      # The command below prints the diff before returning non-zero, so a
      # stale run's log already shows what regenerated differently.
      - name: Fail if regeneration produced a diff
        run: git diff --exit-code -- po/ src/idasen_companion/locale

      # gettext's own PO grammar, not a regex -- the tool below correctly
      # skips the header block and mid-message continuation lines, both of
      # which a naive grep for an empty msgstr misreads as untranslated.
      - name: Fail on an untranslated or unconfirmed (fuzzy) PO entry
        run: |
          for catalog in po/*.po; do
            if msgattrib --untranslated "$catalog" -o - | grep -q '^msgid'; then
              echo "untranslated entry in $catalog" >&2
              exit 1
            fi
            if msgattrib --fuzzy "$catalog" -o - | grep -q '^msgid'; then
              echo "unconfirmed (fuzzy) entry in $catalog" >&2
              exit 1
            fi
          done

      - name: Install appstream (ships appstreamcli)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends appstream

      # Non-strict deliberately: this project gates on exit codes and avoids
      # promoting pedantic hints to failures (see the coverage-gate lesson in
      # project documentation). No grep of appstreamcli's own output either.
      - name: Validate the AppStream metainfo
        run: appstreamcli validate --no-net --explain data/io.github.extricator.IdasenCompanion.metainfo.xml
