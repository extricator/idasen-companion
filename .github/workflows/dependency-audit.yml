name: Bundled dependency audit

on:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Exact bundled Python pins (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact pin sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up audit Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'
      - name: Install pinned audit tooling
        run: python -m pip install --disable-pip-version-check pip-audit==2.10.1
      - name: Audit all exact bundled inventories
        run: python scripts/audit-bundled-dependencies.py --summary "$GITHUB_STEP_SUMMARY"
