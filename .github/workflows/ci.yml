name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: Verification to run
        required: true
        default: core
        type: choice
        options: [core, full, rpm, deb, flatpak, rpm-portability]

permissions:
  contents: read

concurrency:
  group: ordinary-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Plan package proofs
    runs-on: ubuntu-24.04
    outputs:
      rpm: ${{ steps.select.outputs.rpm }}
      deb: ${{ steps.select.outputs.deb }}
      flatpak: ${{ steps.select.outputs.flatpak }}
      rpm_portability: ${{ steps.select.outputs.rpm_portability }}
    steps:
      - name: Check out the repository with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Select package proofs
        id: select
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          UPDATE_BEFORE: ${{ github.event.before }}
          UPDATE_AFTER: ${{ github.event.after }}
          MODE: ${{ inputs.mode }}
          # Keep these path classes in YAML so tests can read the same data.
          # Source changes get Python/quality checks; complete package proof
          # follows approval, a full label run, main, or manual full.
          SHARED_PATHS: '^(pyproject\.toml|MANIFEST\.in|scripts/build-release-variants\.sh|\.github/workflows/packages\.yml|data/(io\.github\.extricator\.IdasenCompanion\.(desktop|metainfo\.xml)|icons/.*))$'
          RPM_PATHS: '^(packaging/[^/]+\.(spec|sh)|packaging/licenses/|scripts/(fetch-bundled-runtime|strip-bundled-tree|verify-bundled-bytecode|verify-bundled-elf|verify-rpm-metadata|trim-cpython|trim-pyside6)\.(sh|py)$|data/idasen-companion\.service$)'
          DEB_PATHS: '^debian/'
          FLATPAK_PATHS: '^(packaging/flatpak/|data/io\.github\.extricator\.IdasenCompanion\.service$)'
          PORTABILITY_PATHS: '^scripts/verify-rpm-portability\.sh$'
        run: |
          set -euo pipefail
          rpm=false deb=false flatpak=false rpm_portability=false
          reason='No package paths in this update'
          if [[ "$EVENT_NAME" == push || "$MODE" == full ]]; then
            rpm=true deb=true flatpak=true rpm_portability=true
            reason='Full run'
          elif [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            case "$MODE" in
              core) reason='Core-only manual run' ;;
              rpm) rpm=true ;;
              deb) deb=true ;;
              flatpak) flatpak=true ;;
              rpm-portability) rpm=true rpm_portability=true ;;
              *) echo "Unknown mode: $MODE" >&2; exit 1 ;;
            esac
          elif [[ "$PR_DRAFT" == true ]]; then
            reason='Draft PR: package proofs deferred'
          else
            base="$PR_BASE"
            head="$PR_HEAD"
            if [[ "$EVENT_ACTION" == synchronize && -n "$UPDATE_BEFORE" && -n "$UPDATE_AFTER" ]]; then
              # A force push can remove the old head. Fetch it if possible;
              # otherwise inspect the full PR diff, never an empty diff.
              git fetch --no-tags origin "$UPDATE_BEFORE" >/dev/null 2>&1 || true
              git fetch --no-tags origin "$UPDATE_AFTER" >/dev/null 2>&1 || true
              if git cat-file -e "$UPDATE_BEFORE^{commit}" 2>/dev/null &&
                 git cat-file -e "$UPDATE_AFTER^{commit}" 2>/dev/null &&
                 git merge-base --is-ancestor "$UPDATE_BEFORE" "$UPDATE_AFTER"; then
                base="$UPDATE_BEFORE"
                head="$UPDATE_AFTER"
                reason='New PR update'
              else
                reason='Full PR diff after unavailable or rewritten update'
              fi
            else
              reason='Full PR diff'
            fi
            git fetch --no-tags origin "$PR_BASE" "$PR_HEAD" >/dev/null 2>&1 || true
            if ! git cat-file -e "$base^{commit}" 2>/dev/null ||
               ! git cat-file -e "$head^{commit}" 2>/dev/null; then
              echo 'Cannot inspect required diff; selecting every package proof.' >&2
              rpm=true deb=true flatpak=true rpm_portability=true
              reason='Full proof because diff could not be inspected'
            else
              while IFS= read -r path; do
                [[ -n "$path" ]] || continue
                if [[ "$path" =~ $SHARED_PATHS ]]; then rpm=true deb=true flatpak=true; fi
                if [[ "$path" =~ $RPM_PATHS ]]; then rpm=true; fi
                if [[ "$path" =~ $DEB_PATHS ]]; then deb=true; fi
                if [[ "$path" =~ $FLATPAK_PATHS ]]; then flatpak=true; fi
                if [[ "$path" =~ $PORTABILITY_PATHS ]]; then rpm=true rpm_portability=true; fi
              done < <(git diff --name-only "$base" "$head")
            fi
          fi
          {
            echo "rpm=$rpm"
            echo "deb=$deb"
            echo "flatpak=$flatpak"
            echo "rpm_portability=$rpm_portability"
          } >> "$GITHUB_OUTPUT"
          echo "### Package plan" >> "$GITHUB_STEP_SUMMARY"
          echo "$reason: RPM=$rpm, Debian=$deb, Flatpak=$flatpak, RPM portability=$rpm_portability" >> "$GITHUB_STEP_SUMMARY"

  verify:
    uses: ./.github/workflows/verify.yml

  packages:
    needs: plan
    uses: ./.github/workflows/packages.yml
    with:
      rpm: ${{ needs.plan.outputs.rpm == 'true' }}
      deb: ${{ needs.plan.outputs.deb == 'true' }}
      flatpak: ${{ needs.plan.outputs.flatpak == 'true' }}
      rpm_portability: ${{ needs.plan.outputs.rpm_portability == 'true' }}

  pr-ci:
    name: PR CI
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: [plan, verify, packages]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every selected caller to succeed
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          PACKAGES_RESULT: ${{ needs.packages.result }}
        run: |
          [[ "$PLAN_RESULT" == success && "$VERIFY_RESULT" == success && "$PACKAGES_RESULT" == success ]]
