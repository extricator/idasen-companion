name: Packages

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ''
      rpm:
        type: boolean
        required: true
      deb:
        type: boolean
        required: true
      flatpak:
        type: boolean
        required: true
      rpm_portability:
        type: boolean
        required: true

permissions:
  contents: read

jobs:
  rpm:
    name: Packages / RPM
    if: inputs.rpm
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - name: Build both RPM release variants in Fedora 43
        run: |
          docker run --rm -i --volume "$PWD:/workspace" --workdir /workspace fedora:43 bash -e -s <<'BUILD'
          dnf install -y git rpm-build rpmdevtools python3-devel python3-pip python3-build \
            python3-setuptools systemd-rpm-macros desktop-file-utils \
            python3-pytest python3-pytest-asyncio \
            /usr/bin/strip /usr/bin/objdump /usr/bin/dbus-run-session \
            'libGL.so.1()(64bit)' 'libEGL.so.1()(64bit)' \
            'libxkbcommon.so.0()(64bit)' 'libfontconfig.so.1()(64bit)' \
            'libfreetype.so.6()(64bit)' 'libdbus-1.so.3()(64bit)'
          git config --global --add safe.directory /workspace
          bash scripts/build-release-variants.sh --rpm --output dist-rpm
          scripts/verify-rpm-metadata.sh dist-rpm/idasen-companion-[0-9]*.rpm
          scripts/verify-rpm-metadata.sh dist-rpm/idasen-companion-headless-*.rpm
          BUILD
      - name: Install each flavor and start its daemon in containers
        if: inputs.rpm_portability
        run: |
          for artifact in dist-rpm/*.rpm; do
            scripts/verify-rpm-portability.sh "$artifact"
          done
      - name: Upload the built RPM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: idasen-companion-rpm
          path: dist-rpm/*.rpm
          if-no-files-found: error
          retention-days: 1

  deb:
    name: Packages / Debian
    if: inputs.deb
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - name: Build both Debian release variants in Debian 13
        run: |
          docker run --rm -i --volume "$PWD:/workspace" --workdir /workspace \
            -e DEBIAN_FRONTEND=noninteractive debian:13 bash -e -s <<'BUILD'
          apt-get update
          apt-get install -y --no-install-recommends git \
            build-essential debhelper dh-python python3-all pybuild-plugin-pyproject \
            devscripts lintian debhelper-compat python3-setuptools \
            python3-pytest python3-pytest-asyncio \
            python3-pyside6.qtcore python3-pyside6.qtgui python3-pyside6.qtwidgets \
            python3-pyside6.qtdbus python3-pyside6.qtsvg \
            qt6-svg-plugins qt6-translations-l10n \
            python3-babel python3-tomlkit python3-yaml python3-dbus-fast \
            python3-idasen python3-bleak
          git config --global --add safe.directory /workspace
          bash scripts/build-release-variants.sh --deb --output dist-deb
          for package in dist-deb/*.deb; do
            lintian --fail-on error,warning \
              --suppress-tags no-manual-page \
              --suppress-tags initial-upload-closes-no-bugs \
              "$package"
          done
          BUILD
      - name: Start a systemd-booted Debian 13 container
        run: |
          docker run -d --name deb-smoke \
            --privileged --cgroupns=host \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            -v "$PWD/dist-deb":/artifacts:ro \
            debian:13 bash -c "apt-get update -qq && \
              DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
                --no-install-recommends systemd systemd-sysv dbus && \
              exec /sbin/init"

      - name: Wait for the container's systemd to finish initialising
        run: |
          # Match against the fixed vocabulary systemd documents for this
          # query, rather than treating any non-empty output as a state. The
          # container installs its init system before exec'ing it, so early
          # polls run before the binary exists -- and Docker reports that on
          # stdout, where a "non-empty means ready" test reads it as a state
          # and lets the next step race the entrypoint's own package install.
          for _ in $(seq 1 180); do
            STATE=$(docker exec deb-smoke systemctl is-system-running 2>/dev/null || true)
            echo "System state: ${STATE:-<unavailable>}"
            case "$STATE" in
              running|degraded|maintenance)
                exit 0
                ;;
            esac
            sleep 1
          done
          echo "Timed out waiting for the container's init system to come up" >&2
          docker logs deb-smoke 2>&1 | tail -40 || true
          exit 1

      - name: Install the .deb from the archive
        run: docker exec deb-smoke bash -c "apt-get update -qq && apt-get install -y /artifacts/idasen-companion_[0-9]*.deb"

      - name: Create an unprivileged test user and enable linger
        run: |
          docker exec deb-smoke useradd -m -s /bin/bash smoketest
          docker exec deb-smoke loginctl enable-linger smoketest
          for _ in $(seq 1 30); do
            if docker exec deb-smoke systemctl -M smoketest@ --user is-system-running >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          echo "Timed out waiting for the test user's systemd --user manager to start" >&2
          exit 1

      - name: The unit lands present and in a normal off state (PKG-03)
        run: |
          # is-enabled exits non-zero for several states -- disabled among
          # them -- that still mean the unit is present and startable, so
          # the exit code cannot be the pass signal; only the printed word
          # can. not-found/masked are the two states a broken package or a
          # broken enable-on-install would actually produce.
          if WORD=$(docker exec deb-smoke systemctl -M smoketest@ --user is-enabled idasen-companion.service 2>/dev/null); then :; fi
          echo "is-enabled reported: $WORD"
          case "$WORD" in
            not-found|masked|masked-runtime)
              echo "Unit is not in a startable state: $WORD" >&2
              exit 1
              ;;
          esac

      - name: Enabling and starting the unit works (PKG-03)
        run: docker exec deb-smoke systemctl -M smoketest@ --user enable --now idasen-companion.service

      - name: The unit was actually started, not just accepted (PKG-03)
        run: |
          ACTIVE=$(docker exec deb-smoke systemctl -M smoketest@ --user show idasen-companion.service --property=ActiveState --value)
          echo "ActiveState reported: $ACTIVE"
          if [ -z "$ACTIVE" ] || [ "$ACTIVE" = "inactive" ]; then
            echo "Unit never left the inactive state -- it was not started" >&2
            exit 1
          fi

      - name: The GUI entry point resolves against the archive's PySide6 (PKG-02)
        run: docker exec -e QT_QPA_PLATFORM=offscreen deb-smoke idasen-companion --version

      - name: Tear down the container
        if: always()
        run: docker rm -f deb-smoke || true
      - name: Upload the built .deb
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: idasen-companion-deb
          path: dist-deb/*.deb
          if-no-files-found: error
          retention-days: 1

  flatpak:
    name: Packages / Flatpak
    if: inputs.flatpak
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.10
      options: --privileged
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - name: Trust the checkout directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Ensure the Python build tooling is available
        run: python3 -m pip install --quiet build

      - name: Install the PySide BaseApp used by the manifest
        run: >-
          flatpak install --noninteractive --assumeyes flathub
          io.qt.PySide.BaseApp//6.10

      - name: Build the full Flatpak release bundle
        run: bash scripts/build-release-variants.sh --flatpak --output dist-flatpak

      - name: Upload the bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: idasen-companion-flatpak
          path: dist-flatpak/*.flatpak
          if-no-files-found: error
          retention-days: 1
